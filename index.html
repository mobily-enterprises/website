<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mobily Enterprises</title>
<meta name="description" content="Mobily Enterprises makes Vibe64 and Mercbot, and does AI research.">
<style>
:root{--bg:#fdf8fd;--fg:#1c1b1f;--muted:#49454f;--card:#f3edf7;--accent:#6750a4;--on-accent:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#141218;--fg:#e6e0e9;--muted:#cac4d0;--card:#211f26;--accent:#d0bcff;--on-accent:#381e72}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:24px 16px}
main{max-width:720px;width:100%}
h1{font-size:clamp(2.5rem,8vw,4.5rem);line-height:1.05;letter-spacing:-.02em;margin:0 0 16px}
p{color:var(--muted);font-size:1.25rem;margin:0 0 32px}
ul{list-style:none;padding:0;margin:0;display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
a{display:block;padding:20px 24px;border-radius:28px;background:var(--card);color:var(--fg);text-decoration:none;font-weight:600;font-size:1.125rem;transition:border-radius .3s cubic-bezier(.2,0,0,1),background .3s}
a:hover,a:focus-visible{border-radius:12px;background:var(--accent);color:var(--on-accent)}
a:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
small{display:block;font-weight:400;opacity:.8;font-size:.9rem}
@media (prefers-reduced-motion:reduce){a{transition:none}}
</style>
</head>
<body>
<main>
<h1>Mobily Enterprises</h1>
<p>We build Vibe64 and Mercbot, and we do AI research. Our new site is on its way.</p>
<ul>
<li><a href="https://vibe64.dev">Vibe64<small>AI coding editor</small></a></li>
<li><a href="https://mercbot.ai">Mercbot<small>People and bots, together</small></a></li>
<li><a href="https://research.mobilyenterprises.com">Research<small>AI Research Diary</small></a></li>
</ul>
</main>
</body>
</html>
