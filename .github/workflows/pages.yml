# Builds the site with Eleventy on every push to main and publishes it with GitHub Pages.
name: Pages

on:
  push:
    branches: [main]
  schedule:
    # Daily, so the Research page picks up new research diary records without a push.
    - cron: "17 21 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          # Reads the research diary's records through the GitHub API with this run's own token.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Check (no JavaScript, valid HTML, links, contrast)
        run: npm run check
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
